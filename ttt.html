<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(ellipse at 50% 0%, #0c0c1e, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 16px;
            margin: 0;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 0;
        }
        .card {
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 28px 20px 24px;
            box-shadow: 0 0 80px rgba(0, 200, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 200, 255, 0.03), transparent, rgba(255, 0, 200, 0.03), transparent);
            animation: spin 12s linear infinite;
            pointer-events: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ff0080, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 128, 0.2);
        }
        .header .scores {
            display: flex;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .header .scores span {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header .scores .w { color: #4ade80; }
        .header .scores .l { color: #f87171; }
        .header .scores .d { color: #fbbf24; }
        .turn-indicator {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            color: #b0b0d0;
        }
        .turn-indicator .highlight {
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            margin: 0 auto 16px;
            position: relative;
            z-index: 2;
        }
        .cell {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            aspect-ratio: 1 / 1;
            color: #fff;
            text-shadow: 0 0 20px currentColor;
            box-shadow: 0 0 0 transparent;
        }
        .cell:active {
            transform: scale(0.92);
        }
        .cell.x {
            color: #ff0080;
            text-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
        }
        .cell.o {
            color: #00aaff;
            text-shadow: 0 0 30px rgba(0, 170, 255, 0.6);
        }
        .cell.win {
            animation: winGlow 0.8s ease-in-out infinite alternate;
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        @keyframes winGlow {
            from { box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
            to { box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
        }
        .cell.pop {
            animation: popIn 0.2s ease forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            position: relative;
            z-index: 2;
            margin-top: 4px;
        }
        .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 24px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            max-width: 140px;
            backdrop-filter: blur(4px);
        }
        .controls button:active {
            transform: scale(0.94);
        }
        .controls button.reset {
            background: rgba(255, 0, 128, 0.15);
            border-color: rgba(255, 0, 128, 0.3);
            color: #ff6b9d;
        }
        .controls button.reset:hover {
            background: rgba(255, 0, 128, 0.25);
        }
        .controls button.new {
            background: rgba(0, 170, 255, 0.15);
            border-color: rgba(0, 170, 255, 0.3);
            color: #6bc8ff;
        }
        .controls button.new:hover {
            background: rgba(0, 170, 255, 0.25);
        }
        .status {
            text-align: center;
            font-size: 14px;
            color: #8899bb;
            margin-top: 14px;
            position: relative;
            z-index: 2;
            min-height: 24px;
        }
        .status .result {
            font-weight: 700;
            font-size: 18px;
            animation: resultPulse 1s ease-in-out;
        }
        @keyframes resultPulse {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #334;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
            position: relative;
            z-index: 2;
            letter-spacing: 0.5px;
        }
        .footer a {
            color: #668;
            text-decoration: none;
        }
        @media (max-width: 480px) {
            .card { padding: 20px 14px; }
            .cell { font-size: 38px; border-radius: 12px; }
            .header h1 { font-size: 18px; }
            .header .scores { font-size: 12px; gap: 8px; }
        }
        @media (max-width: 380px) {
            .cell { font-size: 30px; }
            .controls button { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>🎮 Tic Tac Toe</h1>
            <div class="scores">
                <span class="w">🏆 <span id="wins">0</span></span>
                <span class="l">💀 <span id="losses">0</span></span>
                <span class="d">🤝 <span id="draws">0</span></span>
            </div>
        </div>
        <div class="turn-indicator" id="turnIndicator">⭕ <span class="highlight" id="turnName">Player X</span>'s turn</div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="controls">
            <button class="reset" id="resetBtn">🔄 Reset</button>
            <button class="new" id="newBtn">✨ New Game</button>
        </div>
        <div class="status" id="status">Klik kotak untuk bermain</div>
        <div class="footer">🎵 Sound FX · 🏆 Top Score</div>
    </div>
</div>
<script>
    (function() {
        // --- Audio Engine (Web Audio) ---
        let audioCtx = null;
        function getAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.warn('Audio not supported');
                    return null;
                }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }
        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            const ctx = getAudio();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }
        function soundClick() {
            playTone(600, 0.08, 'square', 0.08);
        }
        function soundWin() {
            [523, 659, 784].forEach((f, i) => {
                setTimeout(() => playTone(f, 0.15, 'sine', 0.12), i * 100);
            });
        }
        function soundLose() {
            [392, 330, 262].forEach((f, i) => {
                setTimeout(() => playTone(f, 0.2, 'sawtooth', 0.10), i * 120);
            });
        }
        function soundDraw() {
            [440, 440, 440].forEach((f, i) => {
                setTimeout(() => playTone(f, 0.12, 'square', 0.08), i * 80);
            });
        }

        // --- Game State ---
        const boardEl = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turnIndicator');
        const turnName = document.getElementById('turnName');
        const statusEl = document.getElementById('status');
        const winsEl = document.getElementById('wins');
        const lossesEl = document.getElementById('losses');
        const drawsEl = document.getElementById('draws');

        let board = Array(9).fill(null);
        let currentPlayer = 'X'; // 'X' or 'O'
        let gameActive = true;
        let playerName = 'Player X'; // bisa diganti dengan nama
        let opponentName = 'Player O';

        // Skor (disimpan di localStorage)
        let scores = { wins: 0, losses: 0, draws: 0 };
        function loadScores() {
            try {
                const data = localStorage.getItem('ttt_scores');
                if (data) {
                    const parsed = JSON.parse(data);
                    scores = { wins: parsed.wins || 0, losses: parsed.losses || 0, draws: parsed.draws || 0 };
                }
            } catch(e) {}
            updateScoreUI();
        }
        function saveScores() {
            try {
                localStorage.setItem('ttt_scores', JSON.stringify(scores));
            } catch(e) {}
            updateScoreUI();
        }
        function updateScoreUI() {
            winsEl.textContent = scores.wins;
            lossesEl.textContent = scores.losses;
            drawsEl.textContent = scores.draws;
        }

        // --- Win Patterns ---
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        // --- Render Board ---
        function renderBoard() {
            cells.forEach((cell, index) => {
                const val = board[index];
                cell.textContent = val || '';
                cell.className = 'cell';
                if (val === 'X') cell.classList.add('x');
                else if (val === 'O') cell.classList.add('o');
            });
        }

        // --- Check Winner ---
        function checkWinner() {
            for (let pattern of winPatterns) {
                const [a,b,c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], pattern: pattern };
                }
            }
            if (board.every(cell => cell !== null)) {
                return { winner: 'draw', pattern: null };
            }
            return null;
        }

        // --- Highlight Winning Cells ---
        function highlightWin(pattern) {
            if (!pattern) return;
            pattern.forEach(idx => {
                cells[idx].classList.add('win');
            });
        }

        // --- End Game ---
        function endGame(result) {
            gameActive = false;
            if (result.winner === 'X') {
                scores.wins++;
                statusEl.innerHTML = '<span class="result">🏆 You Win! 🎉</span>';
                soundWin();
                saveScores();
                highlightWin(result.pattern);
            } else if (result.winner === 'O') {
                scores.losses++;
                statusEl.innerHTML = '<span class="result">💀 You Lose 😢</span>';
                soundLose();
                saveScores();
                highlightWin(result.pattern);
            } else if (result.winner === 'draw') {
                scores.draws++;
                statusEl.innerHTML = '<span class="result">🤝 Draw!</span>';
                soundDraw();
                saveScores();
            }
            updateScoreUI();
            // Matikan klik selanjutnya
        }

        // --- Player Move ---
        function makeMove(index) {
            if (!gameActive) return;
            if (board[index] !== null) return;
            if (currentPlayer === 'O') return; // Hanya player X yang bisa klik (atau bisa dua pemain)

            board[index] = 'X';
            soundClick();
            renderBoard();

            const result = checkWinner();
            if (result) {
                endGame(result);
                return;
            }

            // Ganti ke O (AI)
            currentPlayer = 'O';
            turnName.textContent = opponentName;
            turnIndicator.innerHTML = `❌ <span class="highlight" id="turnName">${opponentName}</span>'s turn`;
            statusEl.textContent = 'AI berpikir...';

            // AI Move setelah jeda 300ms
            setTimeout(() => {
                if (!gameActive) return;
                aiMove();
            }, 300);
        }

        // --- AI Move (basic) ---
        function aiMove() {
            if (!gameActive) return;
            // Cari langkah terbaik: menang, blok, atau acak
            let bestMove = null;

            // 1. Cek menang untuk O
            for (let i=0; i<9; i++) {
                if (board[i] === null) {
                    board[i] = 'O';
                    const result = checkWinner();
                    board[i] = null;
                    if (result && result.winner === 'O') {
                        bestMove = i;
                        break;
                    }
                }
            }
            // 2. Cek blok X menang
            if (bestMove === null) {
                for (let i=0; i<9; i++) {
                    if (board[i] === null) {
                        board[i] = 'X';
                        const result = checkWinner();
                        board[i] = null;
                        if (result && result.winner === 'X') {
                            bestMove = i;
                            break;
                        }
                    }
                }
            }
            // 3. Ambil tengah jika kosong
            if (bestMove === null && board[4] === null) {
                bestMove = 4;
            }
            // 4. Acak
            if (bestMove === null) {
                const empty = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
                if (empty.length > 0) {
                    bestMove = empty[Math.floor(Math.random() * empty.length)];
                }
            }

            if (bestMove !== null) {
                board[bestMove] = 'O';
                soundClick();
                renderBoard();
                const result = checkWinner();
                if (result) {
                    endGame(result);
                    return;
                }
                // Kembali ke X
                currentPlayer = 'X';
                turnName.textContent = playerName;
                turnIndicator.innerHTML = `⭕ <span class="highlight" id="turnName">${playerName}</span>'s turn`;
                statusEl.textContent = 'Giliran kamu';
            } else {
                // Board penuh? cek draw
                const result = checkWinner();
                if (result) endGame(result);
            }
        }

        // --- Reset Board (tanpa reset skor) ---
        function resetBoard() {
            board = Array(9).fill(null);
            gameActive = true;
            currentPlayer = 'X';
            renderBoard();
            cells.forEach(cell => cell.classList.remove('win'));
            statusEl.innerHTML = 'Klik kotak untuk bermain';
            turnName.textContent = playerName;
            turnIndicator.innerHTML = `⭕ <span class="highlight" id="turnName">${playerName}</span>'s turn`;
            // Hapus result class
            const resultSpan = statusEl.querySelector('.result');
            if (resultSpan) resultSpan.className = '';
        }

        // --- Reset All (termasuk skor) ---
        function resetAll() {
            scores = { wins: 0, losses: 0, draws: 0 };
            saveScores();
            resetBoard();
        }

        // --- Event Listeners ---
        cells.forEach(cell => {
            cell.addEventListener('click', function(e) {
                const index = parseInt(this.dataset.index);
                makeMove(index);
            });
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            resetBoard();
            soundClick();
        });

        document.getElementById('newBtn').addEventListener('click', function() {
            resetAll();
            soundClick();
        });

        // --- Inisialisasi ---
        // Ambil nama dari URL atau default
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'Player X';
        playerName = name;
        opponentName = 'AI (O)';
        turnName.textContent = playerName;

        loadScores();
        resetBoard();

        // Jika user klik di mana saja, aktifkan audio context
        document.addEventListener('click', function() {
            getAudio();
        }, { once: true });

        console.log('🎮 Tic Tac Toe loaded!');
    })();
</script>
</body>
</html>
