<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tic Tac Toe</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0A0A0F;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:6px;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;touch-action:manipulation}
    .container{width:100%;max-width:420px;margin:auto}
    .card{background:linear-gradient(180deg,#111118 0%,#0A0A0F 100%);border:2px solid #2A2A35;border-radius:16px;padding:10px 12px 12px;box-shadow:0 0 25px rgba(0,140,255,.12)}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .header h1{font-size:15px;font-weight:900;color:#00A2FF;letter-spacing:.5px;margin:0}
    .scores{display:flex;gap:4px;font-size:10px;font-weight:700}
    .scores span{background:#1F1F29;padding:0 7px;border-radius:8px;border:1px solid #2E2E3A;line-height:18px}
    .scores .w{color:#4ade80}
    .scores .l{color:#f87171}
    .scores .d{color:#fbbf24}
    /* MODE SELECT - DIPERBESAR DAN DIPERJELAS */
    .mode-select{display:flex;gap:6px;justify-content:center;margin-bottom:6px;padding:4px 0}
    .mode-btn{background:#1F1F29;border:2px solid #2E2E3A;border-radius:10px;padding:5px 14px;color:#8A8A9E;font-weight:700;font-size:12px;cursor:pointer;transition:.15s;flex:1;max-width:90px}
    .mode-btn.active{background:#00A2FF22;border-color:#00A2FF;color:#00A2FF;box-shadow:0 0 15px rgba(0,162,255,.15)}
    .mode-btn:active{transform:scale(.94)}
    .turn{text-align:center;font-size:12px;font-weight:600;color:#8A8A9E;margin-bottom:4px}
    .turn .hl{color:#fff}
    .board{display:grid;gap:4px;aspect-ratio:1/1;width:100%;margin:0 auto 4px}
    .cell{background:#16161F;border:2px solid #2E2E3A;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;transition:.15s;aspect-ratio:1/1;color:#fff;text-shadow:0 0 20px currentColor}
    .cell:active{transform:scale(.92)}
    .cell.x{color:#ff0080;text-shadow:0 0 30px rgba(255,0,128,.6)}
    .cell.o{color:#00aaff;text-shadow:0 0 30px rgba(0,170,255,.6)}
    .cell.win{animation:winPulse .8s ease-in-out infinite alternate;border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,.3)}
    @keyframes winPulse{from{box-shadow:0 0 10px rgba(255,215,0,.2)}to{box-shadow:0 0 40px rgba(255,215,0,.6)}}
    .controls{display:flex;gap:6px;justify-content:center;margin-top:4px}
    .controls button{background:#1F1F29;border:1px solid #2E2E3A;border-radius:8px;padding:4px 12px;color:#fff;font-weight:700;font-size:11px;cursor:pointer;transition:.15s;flex:1;max-width:80px}
    .controls button:active{transform:scale(.94)}
    .controls .reset{background:rgba(255,0,128,.12);border-color:rgba(255,0,128,.2);color:#ff6b9d}
    .controls .new{background:rgba(0,170,255,.12);border-color:rgba(0,170,255,.2);color:#6bc8ff}
    .status{text-align:center;font-size:11px;color:#8A8A9E;margin-top:4px;min-height:16px}
    .status .result{font-weight:700;color:#fff;animation:pop .3s ease}
    @keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .footer{text-align:center;font-size:8px;color:#445;margin-top:6px;border-top:1px solid #1a1a2a;padding-top:5px}
    /* MODE BOARD */
    .board-3{grid-template-columns:repeat(3,1fr)}
    .board-6{grid-template-columns:repeat(6,1fr);gap:3px}
    .board-9{grid-template-columns:repeat(9,1fr);gap:2px}
    .board-3 .cell{font-size:clamp(1.8rem,5.5vw,3rem)}
    .board-6 .cell{font-size:clamp(1rem,3vw,1.6rem);border-width:1.5px;border-radius:4px}
    .board-9 .cell{font-size:clamp(.65rem,1.8vw,1rem);border-width:1px;border-radius:3px}
    @media(max-width:480px){
      .container{max-width:100%;padding:0 3px}
      .card{padding:6px 8px 8px}
      .mode-btn{font-size:11px;padding:4px 10px;max-width:75px}
      .board-3 .cell{font-size:clamp(1.4rem,4.5vw,2.4rem)}
      .board-6 .cell{font-size:clamp(.8rem,2.4vw,1.3rem)}
      .board-9 .cell{font-size:clamp(.5rem,1.4vw,.8rem)}
      .header h1{font-size:13px}
      .scores{font-size:9px;gap:3px}
      .controls button{font-size:10px;padding:3px 8px;max-width:60px}
    }
    @media(max-width:380px){
      .mode-btn{font-size:10px;padding:3px 8px;max-width:65px}
      .board-3 .cell{font-size:clamp(1rem,3.5vw,1.8rem)}
      .board-6 .cell{font-size:clamp(.6rem,1.8vw,1rem)}
      .board-9 .cell{font-size:clamp(.4rem,1vw,.65rem)}
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <h1>🎮 Tic Tac Toe</h1>
      <div class="scores">
        <span class="w">🏆 <span id="wins">0</span></span>
        <span class="l">💀 <span id="losses">0</span></span>
        <span class="d">🤝 <span id="draws">0</span></span>
      </div>
    </div>
    <!-- MODE SELECT - TOMBOL 3x3 6x6 9x9 -->
    <div class="mode-select">
      <button class="mode-btn active" data-size="3">⬜ 3x3</button>
      <button class="mode-btn" data-size="6">⬜ 6x6</button>
      <button class="mode-btn" data-size="9">⬜ 9x9</button>
    </div>
    <div class="turn" id="turnIndicator">⭕ <span class="hl" id="turnName">Player X</span>'s turn</div>
    <div class="board board-3" id="board"></div>
    <div class="controls">
      <button class="reset" id="resetBtn">🔄 Reset</button>
      <button class="new" id="newBtn">✨ New</button>
    </div>
    <div class="status" id="status">Klik kotak untuk mulai</div>
    <div class="footer">🎵 Sound FX · 🏆 Skor tersimpan</div>
  </div>
</div>
<script>
  (function() {
    // Audio
    let audioCtx=null;
    function getAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
    function playTone(f,d,t='sine',v=.10){const ctx=getAudio();if(!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
    function sndClick(){playTone(600,.06,'square',.07)}
    function sndWin(){[523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,.12,'sine',.10),i*80))}
    function sndLose(){[392,330,262].forEach((f,i)=>setTimeout(()=>playTone(f,.15,'sawtooth',.08),i*100))}
    function sndDraw(){[440,440,440].forEach((f,i)=>setTimeout(()=>playTone(f,.10,'square',.07),i*60))}

    // DOM
    const boardEl=document.getElementById('board');
    const turnIndicator=document.getElementById('turnIndicator');
    const turnName=document.getElementById('turnName');
    const statusEl=document.getElementById('status');
    const winsEl=document.getElementById('wins');
    const lossesEl=document.getElementById('losses');
    const drawsEl=document.getElementById('draws');
    const modeBtns=document.querySelectorAll('.mode-btn');

    // State
    let board=[], size=3, currentPlayer='X', gameActive=true, playerName='Player X', opponentName='AI (O)';
    let scores={wins:0,losses:0,draws:0};

    function loadScores(){try{const d=localStorage.getItem('ttt_scores');if(d){const p=JSON.parse(d);scores={wins:p.wins||0,losses:p.losses||0,draws:p.draws||0}}}catch(e){}updateScoreUI()}
    function saveScores(){try{localStorage.setItem('ttt_scores',JSON.stringify(scores))}catch(e){}updateScoreUI()}
    function updateScoreUI(){winsEl.textContent=scores.wins;lossesEl.textContent=scores.losses;drawsEl.textContent=scores.draws}

    function getWinPatterns(s){const p=[];for(let i=0;i<s;i++){const row=[];for(let j=0;j<s;j++)row.push(i*s+j);p.push(row)}for(let j=0;j<s;j++){const col=[];for(let i=0;i<s;i++)col.push(i*s+j);p.push(col)}const d1=[];for(let i=0;i<s;i++)d1.push(i*s+i);p.push(d1);const d2=[];for(let i=0;i<s;i++)d2.push(i*s+(s-1-i));p.push(d2);return p}

    function createBoard(s){board=Array(s*s).fill(null);boardEl.className='board board-'+s;boardEl.innerHTML='';for(let i=0;i<s*s;i++){const cell=document.createElement('div');cell.className='cell';cell.dataset.index=i;cell.addEventListener('click',function(){const idx=parseInt(this.dataset.index);makeMove(idx)});boardEl.appendChild(cell)}renderBoard()}

    function renderBoard(){const cells=boardEl.children;for(let i=0;i<board.length;i++){const val=board[i];const cell=cells[i];cell.textContent=val||'';cell.className='cell';if(val==='X')cell.classList.add('x');else if(val==='O')cell.classList.add('o');}}

    function checkWinner(){const patterns=getWinPatterns(size);for(let p of patterns){const first=board[p[0]];if(first&&p.every(i=>board[i]===first))return{winner:first,pattern:p}}if(board.every(v=>v!==null))return{winner:'draw',pattern:null};return null}

    function highlightWin(p){if(!p)return;p.forEach(i=>{const cell=boardEl.children[i];if(cell)cell.classList.add('win')})}

    function endGame(r){gameActive=false;if(r.winner==='X'){scores.wins++;statusEl.innerHTML='<span class="result">🏆 You Win! 🎉</span>';sndWin()}else if(r.winner==='O'){scores.losses++;statusEl.innerHTML='<span class="result">💀 You Lose 😢</span>';sndLose()}else if(r.winner==='draw'){scores.draws++;statusEl.innerHTML='<span class="result">🤝 Draw!</span>';sndDraw()}saveScores();if(r.pattern)highlightWin(r.pattern);updateScoreUI()}

    function makeMove(i){if(!gameActive)return;if(board[i]!==null)return;if(currentPlayer==='O')return;board[i]='X';sndClick();renderBoard();const r=checkWinner();if(r){endGame(r);return}currentPlayer='O';turnName.textContent=opponentName;turnIndicator.innerHTML='❌ <span class="hl">'+opponentName+'</span>\'s turn';statusEl.textContent='AI berpikir...';setTimeout(()=>{if(!gameActive)return;aiMove()},250)}

    function aiMove(){if(!gameActive)return;let best=null;const empty=board.map((v,i)=>v===null?i:null).filter(v=>v!==null);if(empty.length===0){const r=checkWinner();if(r)endGame(r);return}
    for(let i of empty){board[i]='O';const r=checkWinner();board[i]=null;if(r&&r.winner==='O'){best=i;break}}
    if(best===null){for(let i of empty){board[i]='X';const r=checkWinner();board[i]=null;if(r&&r.winner==='X'){best=i;break}}}
    if(best===null){const c=Math.floor(size/2)*size+Math.floor(size/2);if(board[c]===null)best=c}
    if(best===null&&empty.length)best=empty[Math.floor(Math.random()*empty.length)];
    if(best!==null){board[best]='O';sndClick();renderBoard();const r=checkWinner();if(r){endGame(r);return}currentPlayer='X';turnName.textContent=playerName;turnIndicator.innerHTML='⭕ <span class="hl">'+playerName+'</span>\'s turn';statusEl.textContent='Giliran kamu'}else{const r=checkWinner();if(r)endGame(r)}}

    function resetBoard(){board=Array(size*size).fill(null);gameActive=true;currentPlayer='X';renderBoard();const cells=boardEl.querySelectorAll('.cell');cells.forEach(c=>c.classList.remove('win'));statusEl.innerHTML='Klik kotak untuk mulai';turnName.textContent=playerName;turnIndicator.innerHTML='⭕ <span class="hl">'+playerName+'</span>\'s turn';const rs=statusEl.querySelector('.result');if(rs)rs.className=''}

    function resetAll(){scores={wins:0,losses:0,draws:0};saveScores();resetBoard()}

    function changeMode(s){size=s;board=Array(size*size).fill(null);gameActive=true;currentPlayer='X';createBoard(size);resetBoard();modeBtns.forEach(b=>{b.classList.toggle('active',parseInt(b.dataset.size)===s)});}

    // Events
    modeBtns.forEach(btn=>{btn.addEventListener('click',function(){const s=parseInt(this.dataset.size);if(s===size){resetBoard();return}changeMode(s);sndClick()})});
    document.getElementById('resetBtn').addEventListener('click',function(){resetBoard();sndClick()});
    document.getElementById('newBtn').addEventListener('click',function(){resetAll();sndClick()});

    // Init
    const urlParams=new URLSearchParams(window.location.search);playerName=urlParams.get('name')||'Player X';loadScores();changeMode(3);
    document.addEventListener('click',function(){getAudio()},{once:true});
  })();
</script>
</body>
</html>
